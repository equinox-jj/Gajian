spring:
  application:
    name: gajian
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

gajian:
  jwt:
    secret: ${JWT_SECRET}
    issuer: gajian
    access-token-ttl: 15m
