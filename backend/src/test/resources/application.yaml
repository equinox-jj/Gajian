spring:
  application:
    name: gajian
  datasource:
    url: jdbc:h2:mem:gajian;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false

gajian:
  jwt:
    secret: test-secret-that-is-at-least-32-bytes-long
    issuer: gajian-test
    access-token-ttl: 15m
